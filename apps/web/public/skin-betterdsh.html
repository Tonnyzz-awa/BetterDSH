<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<title>BetterDSH · 对话</title>
<style>
:root {
  --bg: #f5f4ed;
  --surface: #faf9f5;
  --surface-warm: #e8e6dc;
  --fg: #141413;
  --fg-2: #3d3d3a;
  --muted: #5e5d59;
  --meta: #87867f;
  --border: #f0eee6;
  --border-soft: #e8e6dc;
  --accent: #c96442;
  --accent-on: #faf9f5;
  --accent-hover: color-mix(in oklab, var(--accent), black 8%);
  --accent-active: color-mix(in oklab, var(--accent), black 14%);
  --success: #17a34a;
  --warn: #eab308;
  --danger: #b53333;
  --font-display: "Anthropic Serif", Georgia, "Times New Roman", serif;
  --font-body: "Anthropic Sans", "Arial", system-ui, -apple-system, sans-serif;
  --font-mono: "Anthropic Mono", ui-monospace, "JetBrains Mono", Menlo, monospace;
  --text-xs: 10px;
  --text-sm: 14px;
  --text-base: 16px;
  --text-lg: 20px;
  --text-xl: 25px;
  --text-2xl: 32px;
  --text-3xl: 52px;
  --text-4xl: 64px;
  --leading-body: 1.6;
  --leading-tight: 1.1;
  --tracking-display: 0em;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;
  --section-y-desktop: 96px;
  --section-y-tablet: 64px;
  --section-y-phone: 48px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-pill: 9999px;
  --elev-flat: none;
  --elev-ring: 0 0 0 1px var(--border);
  --elev-raised: rgba(0, 0, 0, 0.05) 0px 4px 24px;
  --focus-ring: 0 0 0 3px rgba(56, 152, 236, 0.3);
  --motion-fast: 150ms;
  --motion-base: 200ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --container-max: 1200px;
  --container-gutter-desktop: 24px;
  --container-gutter-tablet: 16px;
  --container-gutter-phone: 12px;
}
*, *::before, *::after { box-sizing: border-box; }
html {
  margin: 0; padding: 0;
  width: 100%; height: 100%;
  -webkit-text-size-adjust: 100%;
}
body {
  margin: 0; padding: 0;
  width: 100%; height: 100vh;
  overflow: hidden;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body), "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 16px;
  line-height: 1.6;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}
img, svg { display: block; }
button { font: inherit; cursor: pointer; color: inherit; background: none; border: 0; padding: 0; }
input, textarea, select { font: inherit; color: inherit; }
p { text-wrap: pretty; }
h1, h2, h3 { text-wrap: balance; }
a { color: inherit; text-decoration: none; }
::selection { background: color-mix(in oklch, var(--accent) 22%, transparent); }
:focus-visible {
  outline: 3px solid rgba(56, 152, 236, 0.35);
  outline-offset: 2px;
}
* { scrollbar-width: thin; scrollbar-color: var(--border-soft) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border-soft); border-radius: 999px; border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: var(--meta); background-clip: content-box; border: 3px solid transparent; }
.hidden { display: none !important; }

/* display font helper */
.serif { font-family: var(--font-display), "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "STSong", serif; }
.mono { font-family: var(--font-mono), "PingFang SC", "Microsoft YaHei", monospace; font-variant-numeric: tabular-nums; }
.icon { width: 18px; height: 18px; flex: none; }
.app { display: flex; height: 100vh; width: 100%; }
.sidebar {
  width: 276px;
  flex: none;
  display: flex;
  flex-direction: column;
  background: color-mix(in oklch, var(--bg) 82%, var(--surface-warm));
  border-right: 1px solid var(--border);
  z-index: 30;
  transition: width var(--motion-base) var(--ease-standard), transform var(--motion-base) var(--ease-standard);
  overflow: hidden;
}
.sidebar.collapsed { width: 60px; }
.sidebar.collapsed .sb-head { flex-direction: column; align-items: center; padding: 18px 0 0; gap: 0; }
.sidebar.collapsed .sb-head .brand { flex-direction: column; align-items: center; }
.sidebar.collapsed .brand-mark { margin: 0 auto; }
.sidebar.collapsed .brand-name,
.sidebar.collapsed .brand-sub { display: none; }
.sidebar.collapsed .sb-collapse-btn { margin-top: 2px; transform: rotate(180deg); }
.sidebar.collapsed .sb-search,
.sidebar.collapsed .sb-scroll,
.sidebar.collapsed .sb-group,
.sidebar.collapsed .conv-title,
.sidebar.collapsed .conv-meta,
.sidebar.collapsed .conv-menu,
.sidebar.collapsed .user-meta,
.sidebar.collapsed .user-avatar,
.sidebar.collapsed .btn-new span { display: none; }
.sidebar.collapsed .btn-new { margin: 14px auto 10px; width: 36px; height: 36px; border-radius: var(--radius-md); justify-content: center; padding: 0; }
.sidebar.collapsed .btn-new svg { margin: 0; }
.sidebar.collapsed .sb-foot { padding: 0; display: flex; flex-direction: column; align-items: center; }
.sidebar.collapsed .user-row { padding: 0; }
.sidebar.collapsed .user-row .icon-btn { width: 36px; height: 36px; margin: 4px auto 0; }
.sb-collapse-btn {
  width: 24px; height: 24px; flex: none;
  border-radius: 6px; color: var(--meta);
  display: grid; place-items: center;
  cursor: pointer; transition: background var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
  background: none; border: 0; padding: 0;
}
.sb-collapse-btn:hover { background: color-mix(in oklch, var(--fg) 6%, transparent); color: var(--fg); }
.sidebar.collapsed .sb-collapse-btn { transform: rotate(180deg); }
.sb-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 12px 20px; }
.brand { display: flex; align-items: center; gap: 9px; }
.brand-mark {
  width: 30px; height: 30px; flex: none;
  border-radius: 9px;
  background: var(--fg); color: var(--surface);
  display: grid; place-items: center;
  font-family: var(--font-display), Georgia, serif;
  font-size: 13px; font-weight: 600; letter-spacing: -0.01em;
}
.brand-name { font-family: var(--font-display), "Noto Serif CJK SC", "Songti SC", serif; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.1; }
.brand-sub { font-family: var(--font-mono), monospace; font-size: 10px; letter-spacing: 0.06em; color: var(--muted); }
.btn-new {
  display: flex; align-items: center; gap: 8px;
  margin: 14px 16px 10px;
  padding: 12px 14px;
  border-radius: var(--radius-md);
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--elev-ring);
  font-size: 14px; font-weight: 500;
  color: var(--fg);
  transition: background var(--motion-fast) var(--ease-standard), box-shadow var(--motion-fast) var(--ease-standard);
}
.btn-new:hover { background: color-mix(in oklch, var(--fg) 5%, var(--surface)); box-shadow: 0 0 0 1px var(--border-soft), var(--elev-raised); }
.btn-new svg { color: var(--fg-2); flex: none; }
.sb-search {
  display: flex; align-items: center; gap: 8px;
  margin: 8px 16px 14px;
  padding: 11px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: transparent;
  color: var(--muted);
  font-size: 13.5px;
  transition: border-color var(--motion-fast) var(--ease-standard), background var(--motion-fast) var(--ease-standard);
}
.sb-search:focus-within { border-color: var(--fg-2); background: var(--surface); color: var(--fg); }
.sb-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 13.5px; color: var(--fg); }
.sb-search input::placeholder { color: var(--meta); }
.sb-group {
  padding: 16px 20px 6px;
  font-family: var(--font-mono), monospace;
  font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted);
}
.sb-scroll { flex: 1; overflow-y: auto; padding: 0 12px 16px; }
.sidebar.collapsed .sb-scroll { padding: 0; }
.conv {
  position: relative;
  display: flex; align-items: center; gap: 10px;
  padding: 12px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 14px; line-height: 1.35;
  color: var(--fg);
  transition: background var(--motion-fast) var(--ease-standard);
}
.conv:hover { background: color-mix(in oklch, var(--fg) 5%, transparent); }
.conv.active { background: var(--surface); box-shadow: var(--elev-ring); }
.conv-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv-meta { font-family: var(--font-mono), monospace; font-size: 11px; color: var(--muted); flex: none; }
.list-empty { padding: 32px 12px; font-size: 13px; color: var(--muted); text-align: center; }
.conv-menu {
  flex: none;
  width: 26px; height: 26px;
  display: grid; place-items: center;
  border-radius: 7px;
  color: var(--muted);
  opacity: 0;
  transition: opacity var(--motion-fast) var(--ease-standard), background var(--motion-fast) var(--ease-standard);
}
.conv:hover .conv-menu, .conv.active .conv-menu { opacity: 1; }
.conv-menu:hover { background: color-mix(in oklch, var(--fg) 8%, transparent); color: var(--fg); }
.sb-foot { border-top: 1px solid var(--border); padding: 14px 16px 16px; }
.sidebar.collapsed .sb-foot { border-top: 1px solid var(--border); }
.user-row { display: flex; align-items: center; gap: 10px; padding: 10px 8px 4px; }
.user-meta { min-width: 0; }
.user-row .icon-btn { margin-left: auto; }
.user-avatar {
  width: 32px; height: 32px; flex: none;
  border-radius: 50%;
  background: var(--surface-warm);
  color: var(--fg-2);
  display: grid; place-items: center;
  font-family: var(--font-display), "Noto Serif CJK SC", "Songti SC", serif;
  font-size: 14px; font-weight: 600;
}
.user-name { font-size: 13.5px; font-weight: 600; line-height: 1.3; }
.user-sub { font-family: var(--font-mono), monospace; font-size: 11px; color: var(--muted); line-height: 1.3; }
.chat { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
.chat-header {
  display: flex; align-items: center; gap: 8px;
  padding: 13px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  z-index: 20;
}
.crumb { font-size: 13.5px; color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumb.strong { font-weight: 500; color: var(--fg); }
.crumb-sep { color: var(--meta); margin: 0 2px; font-family: var(--font-mono), monospace; }
.header-actions { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.icon-btn {
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border-radius: 10px;
  color: var(--muted);
  transition: background var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
}
.icon-btn:hover { background: color-mix(in oklch, var(--fg) 6%, transparent); color: var(--fg); }
.icon-btn.on { color: var(--fg); background: color-mix(in oklch, var(--fg) 6%, transparent); }
.btn-ghost {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  font-size: 13.5px; font-weight: 500;
  color: var(--fg-2);
  transition: background var(--motion-fast) var(--ease-standard);
}
.btn-ghost:hover { background: color-mix(in oklch, var(--fg) 6%, transparent); color: var(--fg); }
.menu-toggle { display: none; }

/* messages */
.messages { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.msg-inner { max-width: 780px; margin: 0 auto; padding: 24px 40px 36px; }
.msg-row { display: flex; gap: 16px; padding: 28px 0; }
.msg-row + .msg-row { border-top: 1px solid var(--border); }
.avatar { flex: none; display: grid; place-items: center; font-weight: 600; }
.avatar.user {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--surface-warm); color: var(--fg-2);
  font-family: var(--font-display), "Noto Serif CJK SC", "Songti SC", serif;
  font-size: 13px;
}
.avatar.ai {
  width: 32px; height: 32px;
  border-radius: 10px;
  background: var(--fg); color: var(--surface);
  font-family: var(--font-display), Georgia, serif;
  font-size: 11px; letter-spacing: 0.02em;
}
.msg-body { flex: 1; min-width: 0; }
.msg-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.msg-meta .name { font-size: 14px; font-weight: 600; }
.msg-meta .stamp { font-family: var(--font-mono), monospace; font-size: 11px; color: var(--muted); }
.model-tag {
  font-family: var(--font-mono), monospace;
  font-size: 10px; letter-spacing: 0.05em;
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
  padding: 2px 8px;
}
.msg-body .md p { margin: 0 0 12px; line-height: 1.7; }
.msg-body .md > :last-child { margin-bottom: 0; }

/* thinking block */
.think {
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-md);
  background: var(--surface);
  margin-bottom: 14px;
  overflow: hidden;
  transition: box-shadow var(--motion-fast) var(--ease-standard);
}
.think:hover { border-color: color-mix(in oklch, var(--fg) 14%, var(--border-soft)); }
.think-head {
  display: flex; align-items: center; gap: 8px;
  padding: 13px 16px;
  font-size: 13px; color: var(--fg-2);
  cursor: pointer;
  user-select: none;
}
.think-head svg { color: var(--fg-2); }
.think-head .chev { margin-left: auto; color: var(--meta); transition: transform var(--motion-base) var(--ease-standard); }
.think.open .think-head .chev { transform: rotate(180deg); }
.think-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height var(--motion-base) var(--ease-standard);
  font-size: 13.5px; line-height: 1.7;
  color: var(--muted);
}
.think.open .think-body { max-height: 360px; overflow-y: auto; }
.think-body-inner { padding: 4px 16px 18px; font-family: var(--font-mono), "PingFang SC", "Microsoft YaHei", monospace; }
.think-dots { display: inline-flex; gap: 5px; padding: 12px 14px; }
.think-dots span {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--muted);
  animation: blink 1.2s infinite;
}
.think-dots span:nth-child(2) { animation-delay: 0.15s; }
.think-dots span:nth-child(3) { animation-delay: 0.3s; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-2px); } }
.thinking-label { font-size: 13px; color: var(--muted); padding: 12px 14px 2px; }

/* tool call blocks */
.tool-block {
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-md);
  background: var(--surface);
  margin: 0 0 14px;
  overflow: hidden;
  transition: border-color var(--motion-fast) var(--ease-standard);
}
.tool-block.ok { border-color: color-mix(in oklab, var(--success) 40%, var(--border-soft)); }
.tool-block.err { border-color: color-mix(in oklab, var(--danger) 40%, var(--border-soft)); }
.tool-head {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 16px;
  font-size: 13px; color: var(--fg-2);
  cursor: pointer; user-select: none;
}
.tool-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--meta); flex: none; }
.tool-block.run .tool-dot { background: var(--meta); animation: blink 1.2s infinite; }
.tool-block.ok .tool-dot { background: var(--success); }
.tool-block.err .tool-dot { background: var(--danger); }
.tool-name { font-weight: 600; color: var(--fg-2); }
.tool-status { font-size: 12px; color: var(--meta); }
.tool-block.ok .tool-status { color: var(--success); }
.tool-block.err .tool-status { color: var(--danger); }
.tool-head .chev { margin-left: auto; color: var(--meta); transition: transform var(--motion-base) var(--ease-standard); }
.tool-block.open .tool-head .chev { transform: rotate(180deg); }
.tool-body { max-height: 0; overflow: hidden; transition: max-height var(--motion-base) var(--ease-standard); }
.tool-block.open .tool-body { max-height: 480px; overflow-y: auto; }
.tool-sec { padding: 4px 16px 14px; }
.tool-sec-title { font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--meta); margin-bottom: 6px; }
.tool-args {
  font-family: var(--font-mono), "PingFang SC", "Microsoft YaHei", monospace;
  font-size: 12.5px; line-height: 1.6; color: var(--fg-2);
  background: color-mix(in oklch, var(--fg) 4%, transparent);
  border-radius: 8px; padding: 12px 14px; margin: 0;
  overflow-x: auto; white-space: pre-wrap; word-break: break-word;
}
.tool-result { font-size: 13px; line-height: 1.6; color: var(--muted); white-space: pre-wrap; word-break: break-word; }
.tool-block.err .tool-result { color: var(--danger); }

/* markdown content */
.md { font-size: 15.5px; overflow-wrap: break-word; }
.md h3, .md h4, .md h5 {
  font-family: var(--font-display), "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", serif;
  font-weight: 600; letter-spacing: 0;
  margin: 22px 0 8px; line-height: 1.3;
}
.md h3 { font-size: 19px; }
.md h4 { font-size: 17px; }
.md ul, .md ol { margin: 0 0 12px; padding-left: 22px; }
.md li { margin: 4px 0; }
.md li::marker { color: var(--fg-2); }
.md strong { font-weight: 600; }
.md em { font-style: italic; }
.md a { color: var(--accent); font-weight: 500; }
.md a:hover { text-decoration: underline; }
.md code {
  font-family: var(--font-mono), "PingFang SC", "Microsoft YaHei", monospace;
  font-size: 0.87em;
  background: color-mix(in oklch, var(--fg) 6%, transparent);
  color: var(--fg);
  padding: 1.5px 6px;
  border-radius: 6px;
}
.md table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; margin: 0 0 14px; font-size: 14px; }
.md th, .md td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; vertical-align: top; line-height: 1.5; }
.md th { background: var(--surface); font-weight: 600; font-size: 13.5px; }
.md tr:nth-child(even) td { background: color-mix(in oklch, var(--fg) 2%, transparent); }
.code-wrap { margin: 0 0 14px; border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; background: var(--surface); }
.code-head { display: flex; align-items: center; justify-content: space-between; padding: 7px 8px 7px 14px; border-bottom: 1px solid var(--border); }
.code-head .lang { font-family: var(--font-mono), monospace; font-size: 11px; letter-spacing: 0.05em; color: var(--muted); text-transform: uppercase; }
.code-copy {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 9px;
  border-radius: 7px;
  font-size: 12px; color: var(--muted);
  transition: background var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
}
.code-copy:hover { background: color-mix(in oklch, var(--fg) 6%, transparent); color: var(--fg); }
.code-wrap pre { margin: 0; padding: 14px 16px; overflow-x: auto; }
.code-wrap pre code {
  background: transparent; padding: 0; font-size: 13.5px; line-height: 1.65; color: var(--fg);
}

/* empty state */
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100%; padding: 80px 40px; text-align: center; }
.empty-greet {
  font-family: var(--font-display), "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", serif;
  font-size: clamp(30px, 3.6vw, 46px);
  font-weight: 600; letter-spacing: 0;
  line-height: 1.3;
  margin: 0 0 18px;
}
.empty-sub { color: var(--muted); font-size: 16.5px; margin: 0 0 48px; }
.sugg-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; width: min(720px, 100%); }
.sugg-card {
  display: flex; gap: 13px; align-items: flex-start; text-align: left;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px 20px;
  cursor: pointer;
  transition: box-shadow var(--motion-base) var(--ease-standard), transform 0.05s ease;
}
.sugg-card:hover { box-shadow: var(--elev-raised); }
.sugg-card:active { transform: translateY(1px); }
.sugg-icon { width: 34px; height: 34px; flex: none; border-radius: 9px; background: color-mix(in oklch, var(--fg) 5%, transparent); display: grid; place-items: center; color: var(--fg); }
.sugg-card .t { font-size: 14.5px; font-weight: 600; line-height: 1.4; }
.sugg-card .d { font-size: 13px; color: var(--muted); line-height: 1.5; margin-top: 3px; }

/* composer */
.composer-wrap { padding: 18px 32px 22px; }
.composer {
  max-width: 780px;
  margin: 0 auto;
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: var(--elev-raised);
  transition: border-color var(--motion-fast) var(--ease-standard), box-shadow var(--motion-fast) var(--ease-standard);
}

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  };
  var store = {
    get: function (k, d) { try { var v = window.localStorage.getItem("ds." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { window.localStorage.setItem("ds." + k, JSON.stringify(v)); } catch (e) {} }
  };
  var DATA = [];

  function rpcId() { return 'r-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8); }
  function newSessionId() { return 'web-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }

  function dayGroup(ts) {
    if (!ts) return "更早";
    var d = new Date(ts);
    var now = new Date();
    var dd = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var nd = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var diff = Math.round((nd - dd) / 86400000);
    if (diff <= 0) return "今天";
    if (diff === 1) return "昨天";
    if (diff <= 7) return "前 7 天";
    return "更早";
  }
  function timeOf(ts) {
    if (!ts) return "";
    var d = new Date(ts);
    return (d.getHours() < 10 ? "0" + d.getHours() : d.getHours()) + ":" + (d.getMinutes() < 10 ? "0" + d.getMinutes() : d.getMinutes());
  }
  var api = {
    post: function (method, payload) {
      return fetch("/api/" + method, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ type: "client-request", rpcId: rpcId(), method: method, payload: payload })
      }).then(function (r) { return r.json(); });
    },
    createSession: function () {
      var payload = state.selectedWorkspaceId ? { workspaceId: state.selectedWorkspaceId } : {};
      return api.post("session.create", payload).then(function (res) {
        if (res.result && res.result.ok) return res.result.value.sessionId;
        throw new Error(res.result && res.result.error ? res.result.error.message : "session.create failed");
      });
    },
    prompt: function (sid, text) {
      return api.post("session.prompt", {
        sessionId: sid, mode: "queue",
        content: [{ type: "text", text: text }],
        clientTimeZone: Intl.DateTimeFormat().resolvedOptions().timeZone
      }).then(function (res) {
        if (res.result && res.result.ok) return res.result.value;
        throw new Error(res.result && res.result.error ? res.result.error.message : "session.prompt failed");
      });
    }
  };

  var evtSource = null;
  var liveMsgs = {};
  function connectSSE() {
    if (evtSource) { try { evtSource.close(); } catch (e) {} }
    var proto = window.location.protocol === "https:" ? "wss:" : "ws:";
    var url = proto + "//" + window.location.host + "/api/events.mux";
    try { evtSource = new WebSocket(url); } catch (e) { return; }
    evtSource.onmessage = function (ev) {
      var msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (!msg || msg.type !== "server-request") return;
      var p = msg.payload;
      if (!p) return;
      if (p.type === "session/event") onSessionEvent(p.sessionId, p.event);
      else if (p.type === "stream/error") toast("流错误: " + (p.error && p.error.message || ""));
    };
    evtSource.onclose = function () {
      window.setTimeout(function () { connectSSE(); }, 3000);
    };
    evtSource.onerror = function () {
      try { evtSource.close(); } catch (e) {}
    };
  }

  function stripText(content) {
    if (!Array.isArray(content)) return "";
    return content.filter(function (b) { return b && b.type === "text"; }).map(function (b) { return b.text || ""; }).join("");
  }

  var pendingMap = {};
  function convFor(sid) {
    if (pendingMap[sid]) return pendingMap[sid];
    return findConv(sid);
  }
  function registerPending(realSid, conv) {
    pendingMap[realSid] = conv;
  }
  function clearPending(realSid) {
    delete pendingMap[realSid];
  }
  function onSessionEvent(sid, event) {
    if (!event || !event.type) return;
    var conv = convFor(sid);
    if (!conv) return;
    var etype = event.type;
    var data = event.data || {};

    if (etype === "session/title") {
      if (conv) { conv.title = data.title || conv.title; conv.ts = data.titleSeq; renderList(); if (state.activeId === sid) $("crumb-b").textContent = conv.title; }
      return;
    }
    if (etype === "turn/start") {
      if (conv && state.activeId === sid) $("crumb-b").textContent = conv.title;
      return;
    }
    if (etype === "assistant/chunk") {
      var chunk = data.chunk || {};
      if (chunk.type === "text-delta") {

  function rpc(method, payload) {
    return fetch("/api/" + method, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ type: "client-request", rpcId: rpcId(), method: method, payload: payload || {} })
    }).then(function (r) { return r.json(); })
      .then(function (res) {
        if (res && res.result && res.result.ok) return res.result.value;
        throw new Error((res && res.result && res.result.error && res.result.error.message) || method + " failed");
      });
  }

  function credRefFor(p) {
    if (!p) return null;
    if (p.settingsNs === "llm-deepseek") return "DEEPSEEK_API_KEY";
    if (p.settingsNs === "llm-pi-ai") return p.provider.toUpperCase().replace(/[^A-Z0-9]/g, "_") + "_API_KEY";
    return null;
  }

  function presetFor(p) {
    if (!p) return "";
    if (p.settingsNs === "llm-deepseek") return "https://api.deepseek.com";
    if (p.settingsNs === "llm-pi-ai") {
      if (p.provider === "deepseek") return "https://api.deepseek.com";
      if (p.provider === "openai") return "https://api.openai.com";
      if (p.provider === "anthropic") return "https://api.anthropic.com";
      if (p.provider === "openrouter") return "https://openrouter.ai/api/v1";
      if (p.provider === "google") return "https://generativelanguage.googleapis.com";
    }
    return "";
  }

  function findProvider(pid) {

    rpc("llm.models", {}).then(function (v) {

      var g = null;
      for (var i = 0; i < groups.length; i++) { if (groups[i].id === p.provider) { g = groups[i]; break; } }

    (function(r) {

        method: "POST",

        body: JSON.stringify({ type: "client-request", rpcId: rpcId(), method: "credentials.describe", payload: { refs: [r] } })
      }).then(function(r2) { return r2.json(); })
        .then(function(res) {
          if (res && res.result && res.result.ok) {
            var cr = res.result.value;
            var c = cr && cr.credentials && cr.credentials[r];
            if (c && c.configured) setStatus(c.source ? "凭据已配置（" + c.source + "）" : "凭据已配置", false);
          }

        .catch(function() {});

  function loadHistory(id, conv) {
    fetch("/api/session.history", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ type: "client-request", rpcId: rpcId(), method: "session.history", payload: { sessionId: id, maxMessages: 50 } })
    }).then(function (r) { return r.json(); }).then(function (res) {
      if (!res || !res.result || !res.result.ok || !res.result.value) return;
      var events = res.result.value.events || [];
      conv.msgs = [];
      for (var i = 0; i < events.length; i++) {
        var e = events[i].event;
        if (!e || !e.type) continue;
        var t = e.type;
        if (t === "user/message" && e.data && e.data.content) {
          var text = "";
          for (var j = 0; j < e.data.content.length; j++) {
            if (e.data.content[j].type === "text") text += e.data.content[j].text;
          }
          if (text) conv.msgs.push({ r: "u", c: text });
        } else if (t === "assistant/message") {
          var am = "";
          var content = e.data && e.data.message && e.data.message.content;
          if (Array.isArray(content)) {
            for (var k = 0; k < content.length; k++) if (content[k] && content[k].type === "text") am += content[k].text;
          } else if (typeof (e.data.message.text) === "string") { am = e.data.message.text; }
          if (am) conv.msgs.push({ r: "a", c: am, model: "" });
        } else if (t === "tool/call" && e.data) {
          var tcid = e.data.callId || "";
          var tname = e.data.name || "?";
          var targs = e.data.arguments || "";
          if (targs && typeof targs === "object") { try { targs = JSON.stringify(targs, null, 2); } catch (e2) { targs = String(targs); } }
          conv.msgs.push({ r: "t", name: tname, args: String(targs).slice(0, 800), result: "", isError: false, callId: tcid });
        } else if (t === "tool/result" && e.data) {
          var rmsg = e.data.message || {};
          var rcid = rmsg.callId || "";
          var rtext = stripText(rmsg.content);
          rtext = rtext.split(/\s+/).join(" ").slice(0, 500);
          var rerr = !!rmsg.isError;
          var paired = false;
          if (rcid) {
            for (var pi = conv.msgs.length - 1; pi >= 0; pi--) {
              if (conv.msgs[pi].r === "t" && conv.msgs[pi].callId === rcid && !conv.msgs[pi].result) {
                conv.msgs[pi].result = rtext; conv.msgs[pi].isError = rerr; paired = true; break;
              }
            }
          }
          if (!paired) conv.msgs.push({ r: "t", name: "?", args: "", result: rtext, isError: rerr, callId: rcid });
        } else if (t === "session/title" && e.data && e.data.title) {
          conv.title = e.data.title;
        }
      }
      conv.ts = Date.now();
      conv.time = nowStamp();
      if (state.activeId === id) renderConversation(id);
    }).catch(function () {});
  }

  function loadSessions() {
    fetch("/api/session.list", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ type: "client-request", rpcId: rpcId(), method: "session.list", payload: {} })
    }).then(function (r) { return r.json(); }).then(function (res) {
      if (!res || !res.result || !res.result.ok || !res.result.value) { toast("加载会话失败: 无数据"); return; }
      var items = res.result.value.items || [];
      var seen = {};
      DATA.forEach(function (c) { seen[c.id] = true; });
      var added = 0;
      items.forEach(function (s) {
        if (seen[s.sessionId] || s.blank === true) return;
        var title = (s.projections && s.projections.values && s.projections.values.title) || s.sessionId.slice(0, 8);
        DATA.push({ id: s.sessionId, title: title, ts: s.updatedAt, time: "", msgs: [], group: "" });
        added++;
      });
      DATA.forEach(function (c) {
        var d = new Date(c.ts);
        var nd = new Date();
        var diff = Math.round((nd - d) / 86400000);
        c.group = diff <= 0 ? "今天" : diff === 1 ? "昨天" : diff <= 7 ? "前 7 天" : "更早";
        c.time = (d.getHours() < 10 ? "0" + d.getHours() : d.getHours()) + ":" + (d.getMinutes() < 10 ? "0" + d.getMinutes() : d.getMinutes());
      });
      renderList();
      toast("已加载 " + added + " 个会话");
    }).catch(function (err) { toast("加载会话失败: " + (err.message || "")); });
  }

      return rpc("settings.describe", {}).then(function (sd) {
        var piAi = null;
        if (sd && sd.namespaces) { for (var i = 0; i < sd.namespaces.length; i++) { if (sd.namespaces[i].ns === "llm-pi-ai") { piAi = sd.namespaces[i]; break; } } }
        var providers = (piAi && piAi.value && piAi.value.providers) ? JSON.parse(JSON.stringify(piAi.value.providers)) : {};
        providers[pid] = { apiKeyEnv: ref, displayName: name, api: apiType, baseURL: url, models: [{ id: "default", name: name + " Default", contextWindow: 4096, maxTokens: 4096 }] };
        return rpc("settings.update", { ns: "llm-pi-ai", patch: { providers: providers } });
      });
    }).then(function () {
      setStatus("已添加: " + name, false);
      toast("已添加 " + name);
      closeCpDialog();
      return rpc("llm.providers", {});
    }).then(function (v) {
      apiProviders = (v && v.providers) || [];
      fillProviderSelect();
      selectedProvider = pid;
      var sel = document.getElementById("api-provider");
      if (sel) { try { sel.value = pid; } catch (e) {} }
      loadProviderConfig();
    }).catch(function (err) { setStatus("添加失败: " + (err.message || ""), true); });
  });

  function loadWorkspaces() {
    rpc("workspace.list", {}).then(function (v) {
      var items = (v && v.items) || [];
      var list = document.getElementById("workspace-list");
      if (!list) return;
      if (state.selectedWorkspaceId && !items.some(function (w) { return w.workspaceId === state.selectedWorkspaceId; })) {
        state.selectedWorkspaceId = null;
        store.set("workspaceId", null);
      }
      list.innerHTML = items.map(function (w) {
        var sel = w.workspaceId === state.selectedWorkspaceId ? " on" : "";
        return '<div class="model-card' + sel + '" data-wid="' + esc(w.workspaceId) + '">' +
          '<div class="model-card-radio"></div>' +
          '<div class="model-card-info">' +
          '<div class="model-card-name">' + esc(w.title) + '</div>' +
          '<div class="model-card-desc">' + esc(w.path) + ' · ' + w.sessionIds.length + ' 会话</div>' +
          '</div></div>';
      }).join("") || '<div style="padding:20px;text-align:center;color:var(--muted)">无工作区</div>';
      Array.prototype.forEach.call(list.querySelectorAll(".model-card[data-wid]"), function (card) {
        card.addEventListener("click", function () {
          var wid = card.getAttribute("data-wid");
          if (state.selectedWorkspaceId === wid) {
            state.selectedWorkspaceId = null;
          } else {
            state.selectedWorkspaceId = wid;
          }
          store.set("workspaceId", state.selectedWorkspaceId);
          Array.prototype.forEach.call(list.querySelectorAll(".model-card[data-wid]"), function (c) {
            c.classList.toggle("on", c.getAttribute("data-wid") === state.selectedWorkspaceId);
          });
        });
      });
    }).catch(function () {});
  }
  document.getElementById("ws-create").addEventListener("click", function () {
    var path = document.getElementById("ws-path").value.trim();
    if (!path) { document.getElementById("ws-status").textContent = "请输入路径"; document.getElementById("ws-status").className = "api-status err"; return; }
    rpc("workspace.create", { path: path }).then(function () {
      document.getElementById("ws-path").value = "";
      document.getElementById("ws-status").textContent = "工作区已创建"; document.getElementById("ws-status").className = "api-status ok";
      loadWorkspaces();
    }).catch(function (err) {
      document.getElementById("ws-status").textContent = "创建失败: " + (err.message || ""); document.getElementById("ws-status").className = "api-status err";
    });
  });
  document.getElementById("ws-path").addEventListener("keydown", function (e) { if (e.key === "Enter") document.getElementById("ws-create").click(); });
  document.getElementById("ws-browse").addEventListener("click", function () {
    rpc("host.pickDirectory", {}).then(function (v) {
      if (v && v.path) document.getElementById("ws-path").value = v.path;
    }).catch(function (err) {
      var st = document.getElementById("ws-status");
      if (st) { st.textContent = "目录选择失败: " + (err.message || ""); st.className = "api-status err"; }
    });
  });
  var $input = $("composer-input");
  function autoGrow() {
    $input.style.height = "auto";
    $input.style.height = Math.min(200, $input.scrollHeight) + "px";
  }
  function updateSend() {
    $("send-btn").disabled = !$input.value.trim();
  }
  $input.addEventListener("input", function () { autoGrow(); updateSend(); });
  $input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      if ($input.value.trim()) { doSend(); }
    }
  });
  function doSend() {
    if (state.busy) return;
    var text = $input.value.trim();
    if (!text) return;
    sendMessage(text);
    $input.value = "";
    autoGrow();
    updateSend();
  }

  $("send-btn").addEventListener("click", doSend);
  $("btn-new").addEventListener("click", newChat);
  $("btn-panel").addEventListener("click", function () { setPanel(!state.panelOpen); });
  $("btn-settings").addEventListener("click", function () { setPanel(true); });
  $("btn-panel-close").addEventListener("click", function () { setPanel(false); });
  $("btn-sidebar").addEventListener("click", function () { setSidebar(!state.sidebarOpen); });
  var collapseBtn = $("btn-collapse");
  if (collapseBtn) collapseBtn.addEventListener("click", toggleSidebar);
  $("scrim").addEventListener("click", function () { setSidebar(false); });
  $("panel-backdrop").addEventListener("click", function () { setPanel(false); });
  $("btn-stop").addEventListener("click", function () {
    if (state.activeId) rpc("session.cancel", { sessionId: state.activeId }).catch(function () {});
  });
  $("btn-clear").addEventListener("click", function () {
    if (state.activeId) newChat();
  });

  /* conversation list interactions */
  function checkMark(on) {
    return on
      ? '<svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>'
      : "";
  }
  function closeMenus() {
    var m = document.querySelector(".menu");
    if (m) m.remove();
    modelMenu = null;
  }
  document.addEventListener("click", function (e) {
    if (!e.target.closest(".menu") && !e.target.closest("#btn-model-pick")) closeMenus();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      closeMenus();
      if (state.panelOpen) setPanel(false);
      if (state.sidebarOpen) setSidebar(false);
    }
  });

  $("sb-scroll").addEventListener("click", function (e) {
    var menuBtn = e.target.closest(".conv-menu");
    var conv = e.target.closest(".conv");
    if (conv && conv.dataset.id) {
      if (menuBtn) {
        e.stopPropagation();
        openConvMenu(menuBtn, conv.dataset.id);
      } else {
        var id = conv.dataset.id;
        var c = findConv(id);
        if (c && !c.msgs.length) { loadHistory(id, c); }
        renderConversation(id);
        if (window.innerWidth <= 920) setSidebar(false);
      }
    }
  });
  $("sb-scroll").addEventListener("keydown", function (e) {
    var conv = e.target.closest(".conv");
    if (conv && conv.dataset.id && !e.target.closest(".conv-menu") && (e.key === "Enter" || e.key === " ")) {
      e.preventDefault();
      renderConversation(conv.dataset.id);
      if (window.innerWidth <= 920) setSidebar(false);
    }
  });

  function openConvMenu(btn, id) {
    closeMenus();
    var r = btn.getBoundingClientRect();
    var menu = document.createElement("div");
    menu.className = "menu";
    menu.style.top = (r.bottom + 6) + "px";
    menu.style.left = Math.min(r.right - 196, window.innerWidth - 204) + "px";
    menu.innerHTML =
      '<button class="menu-item" data-act="rename"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 4.8l4 4L8 20H4v-4L15.2 4.8z"/></svg>重命名</button>' +
      '<button class="menu-item" data-act="fork"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v12"/><path d="M18 3v12"/><path d="M6 9c0 4 6 4 6 0"/><path d="M18 9c0 4-6 4-6 0"/></svg>复制对话</button>' +
      '<button class="menu-item danger" data-act="delete"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>删除对话</button>';
    document.body.appendChild(menu);
    menu.querySelector('[data-act="rename"]').addEventListener("click", function () { renameConv(id); closeMenus(); });
    menu.querySelector('[data-act="fork"]').addEventListener("click", function () { forkConv(id); closeMenus(); });
    menu.querySelector('[data-act="delete"]').addEventListener("click", function () { deleteConv(id); closeMenus(); });
  }

  function renameConv(id) {
    var conv = findConv(id);
    var el = document.querySelector('.conv[data-id="' + id + '"] .conv-title');
    if (!el) return;
    var input = document.createElement("input");
    input.value = conv.title;
    input.style.cssText = "border:1px solid var(--fg);border-radius:6px;padding:3px 7px;font:inherit;font-size:14px;width:100%;background:var(--surface);";
    el.replaceWith(input);
    input.focus(); input.select();
    function commit(save) {
      if (save && input.value.trim() && input.value.trim() !== conv.title) {
        conv.title = input.value.trim();
        if (state.activeId === id) $("crumb-b").textContent = conv.title;
        api.post("session.rename", { sessionId: id, title: conv.title }).catch(function () {});
      }
      var span = document.createElement("span");
      span.className = "conv-title";
      span.textContent = conv.title;
      input.replaceWith(span);
      renderList();
    }
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { commit(true); }
      if (e.key === "Escape") { commit(false); }
    });
    input.addEventListener("blur", function () { commit(true); });
  }

  function deleteConv(id) {
    var idx = -1;
    for (var i = 0; i < DATA.length; i++) if (DATA[i].id === id) idx = i;
    if (idx === -1) return;
    DATA.splice(idx, 1);
    if (state.activeId === id) newChat();
    renderList();
  }

  function forkConv(id) {
    api.post("session.fork", { sessionId: id }).then(function (res) {
      if (res.result && res.result.ok && res.result.value) {
        newChat();
        toast("对话已复制");
      } else {
        toast("复制失败: " + ((res.result && res.result.error && res.result.error.message) || ""));
      }
    }).catch(function (err) { toast("复制失败: " + (err.message || "")); });
  }

  /* attachment */
  $("btn-attach").addEventListener("click", function () { $("attach-file").click(); });
  $("attach-file").addEventListener("change", function () {
    if (!this.files || !this.files.length) return;
    files = Array.prototype.slice.call(this.files);
    var f = files[0];
    $("file-chip-name").textContent = files.length > 1 ? f.name + " 等 " + files.length + " 个文件" : f.name;
    $("file-chip-size").textContent = files.length > 1 ? "" : formatSize(f.size);
    $("file-chip").classList.remove("hidden");
    this.value = "";
  });
  $("file-chip-x").addEventListener("click", function () {
    files = [];
    $("file-chip").classList.add("hidden");
  });
  function formatSize(b) {
    if (b < 1024) return b + " B";
    if (b < 1048576) return (b / 1024).toFixed(1) + " KB";
    return (b / 1048576).toFixed(1) + " MB";
  }

  /* suggestion cards */
  document.querySelectorAll(".sugg-card").forEach(function (card) {
    card.addEventListener("click", function () {
      $input.value = card.getAttribute("data-prompt") || "";
      autoGrow();
      updateSend();
      doSend();
    });
  });

  /* panel controls */

  /* export */
  $("btn-export").addEventListener("click", function () {
    var conv = findConv(state.activeId);
    if (!conv) { toast("当前没有可导出的对话"); return; }
    var lines = ["# " + conv.title, ""];
    conv.msgs.forEach(function (m) {
      if (m.r === "t") {
        lines.push("### 工具：" + (m.name || "?") + (m.isError ? " — 出错" : (m.result ? " — 已完成" : "")), "");
        if (m.args) lines.push("**参数**", "", "```", m.args, "```", "");
        if (m.result) lines.push("**输出**", "", m.result, "");
        return;
      }
      lines.push(m.r === "u" ? "## 用户" : "## DeepSeek");
      if (m.think) lines.push("> 思考过程：\n>\n> " + m.think.replace(/\n/g, "\n> "));
      lines.push(m.c, "");
    });
    var text = lines.join("\n");
    try {
      var blob = new Blob([text], { type: "text/markdown" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = (conv.title || "对话") + ".md";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      toast("对话已导出为 Markdown");
    } catch (e) { copyText(text); }
  });

  var br = $("btn-restart");
  if (br) br.addEventListener("click", function () {
    var b = this;
    b.disabled = true;
    b.style.opacity = "0.6";
    window.setTimeout(function () { b.disabled = false; b.style.opacity = "1"; toast("本地服务已重启"); }, 800);
  });

  $("toast-close").addEventListener("click", function () { $("toast").classList.remove("show"); });

  $("sb-search").addEventListener("input", renderList);
  if (sidebarCollapsed) $("sidebar").classList.add("collapsed");
  setPanel(state.panelOpen);
  connectSSE();
  newChat();
  renderList();
  loadAll();
  setTimeout(function () {
    fetch("/api/credentials.describe", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ type: "client-request", rpcId: rpcId(), method: "credentials.describe", payload: { refs: ["DEEPSEEK_API_KEY"] } })
    }).then(function (r) { return r.json(); }).then(function (res) {
      if (res && res.result && res.result.ok) {
        var cr = res.result.value;
        var c = cr && cr.credentials && cr.credentials["DEEPSEEK_API_KEY"];
        if (c && c.configured) {
          setStatus(c.source ? "凭据已配置（" + c.source + "）" : "凭据已配置", false);
        } else {
          setStatus("未检测到凭据 — 请手动输入 API Key", true);
        }
      } else {
        setStatus("凭据检测失败", true);
      }
    }).catch(function () { setStatus("凭据检测请求失败", true); });
  }, 2000);
  loadWorkspaces();
})();
</script>
</body>
</html>
